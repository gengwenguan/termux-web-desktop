<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 背景圆角方块：Ubuntu 风格橙色渐变 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E95420"/>
      <stop offset="1" stop-color="#C7431A"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <!-- 终端窗口 -->
  <rect x="12" y="16" width="40" height="32" rx="4" fill="#2b2b2b"/>
  <!-- 标题栏三色点 -->
  <circle cx="18" cy="22" r="2" fill="#ff5f57"/>
  <circle cx="25" cy="22" r="2" fill="#febc2e"/>
  <circle cx="32" cy="22" r="2" fill="#28c840"/>
  <!-- 命令提示符 >_ -->
  <path d="M18 32 l6 4 l-6 4" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="27" y1="41" x2="38" y2="41" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
</svg>
